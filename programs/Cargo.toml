# Programas de usuário do os-rust (ring 3). Compilados para o target
# `x86_64-os_rust_user.json` pelo `build.rs` do kernel, nunca diretamente
# por `cargo run`/`cargo test` (ver `default-members` no Cargo.toml raiz).
# Cada arquivo de `src/bin/` é um programa; todos usam a biblioteca de
# runtime do projeto (`runtime/`), que fornece o ponto de entrada, `print!`,
# a leitura de linha e o alocador.
#
# Sem `[profile.*]`: perfis só valem na raiz do workspace, e o
# `panic = "abort"` já vem do próprio target de usuário.
[package]
name = "programs"
version = "0.1.0"
edition = "2021"

[dependencies]
runtime = { path = "../runtime" }

# `visita` é o programa que existe só no disco. Fica em `src/disco/`, e não em
# `src/bin/`, de propósito: o `build.rs` do kernel monta a tabela de programas
# embutidos varrendo apenas `src/bin/`, então este NÃO entra no kernel. O mesmo
# `cargo build` o compila, e o `build.rs` grava o ELF em `/disco/bin/visita`.
[[bin]]
name = "visita"
path = "src/disco/visita.rs"
