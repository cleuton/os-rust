[package]
name = "os-rust"
version = "0.7.0"
edition = "2021"

[dependencies]
abi = { path = "abi" }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.2"
pic8259 = "0.11.0"
uart_16550 = "0.3.2"
linked_list_allocator = "0.10.5"

[dependencies.bootloader]
version = "0.9.23"
features = ["map_physical_memory"]

[dependencies.lazy_static]
version = "1.4.0"
features = ["spin_no_std"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "page_fault"
harness = false

[[test]]
name = "double_fault"
harness = false

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]
test-args = ["-serial", "stdio", "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-display", "none"]
test-success-exit-code = 33
test-timeout = 60

# O pacote raiz continua sendo o kernel. `programs`, `runtime` e `abi` são
# membros do workspace só para satisfazer o cargo (um pacote dentro da árvore
# de outro precisa ser membro ou estar excluído), e `default-members` mantém
# `cargo run` e `cargo test` restritos ao kernel: `programs` (e `runtime`, que
# eles usam) só são compilados pelo `build.rs` do kernel, para o target de
# usuário. Só `abi` entra no kernel como dependência: são as constantes do
# contrato de syscalls, compartilhadas com a biblioteca de runtime.
[workspace]
members = ["programs", "runtime", "abi"]
default-members = ["."]
