[package]
name = "os-rust"
version = "0.12.0"
edition = "2021"

[dependencies]
abi = { path = "abi" }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.2"
pic8259 = "0.11.0"
uart_16550 = "0.3.2"
linked_list_allocator = "0.10.5"

[dependencies.bootloader]
version = "0.9.23"
features = ["map_physical_memory"]

[dependencies.lazy_static]
version = "1.4.0"
features = ["spin_no_std"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "page_fault"
harness = false

[[test]]
name = "double_fault"
harness = false

[package.metadata.bootimage]
# Discos de dados (o disco de boot, que o `bootimage` acrescenta, é o
# primário-mestre, `index=0`). `index=1` é o primário-escravo: o `/disco` do
# kernel (`target/imagens/disco.img`, gerada pelo `build.rs`). Só nos testes,
# `index=2` é o secundário-mestre, com uma imagem de volume corrompido; o
# secundário-escravo (`index=3`) fica **vazio** de propósito, para os testes
# provarem que a ausência de disco não trava o kernel. `snapshot=on` manda as
# escritas para um arquivo temporário do QEMU: a imagem nunca muda, mesmo que o
# kernel grave no `/disco` (`readonly=on` o QEMU recusa em disco IDE). Para
# preservar o que se grava, rode o QEMU à mão sobre uma cópia da imagem (README,
# "Preservando o disco entre boots"). O caminho é relativo à raiz do
# repositório, de onde `cargo run` e `cargo test` são sempre executados.
#
# Rede (Marco 12): `-nic user,model=rtl8139` põe no QEMU a placa que o kernel
# conhece (Realtek RTL8139) ligada à rede de usuário do próprio QEMU (SLIRP:
# endereço 10.0.2.15, gateway 10.0.2.2, sem precisar de internet nem de
# privilégio de administrador). Nos testes, `guestfwd=tcp:10.0.2.100:7-cmd:cat`
# acrescenta um serviço de eco falso em 10.0.2.100:7 (o QEMU roda o utilitário
# `cat` do computador): é com ele que se prova o TCP pela placa. O `run-args`
# **não** leva `hostfwd`: uma porta já ocupada no computador impediria o QEMU de
# abrir. Para o computador falar com o kernel, o README ensina o comando do QEMU
# à mão (seção "Rede no QEMU").
run-args = ["-serial", "stdio", "-drive", "file=target/imagens/disco.img,format=raw,if=ide,index=1,snapshot=on", "-nic", "user,model=rtl8139"]
test-args = [
    "-serial", "stdio",
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-display", "none",
    "-drive", "file=target/imagens/disco.img,format=raw,if=ide,index=1,snapshot=on",
    "-drive", "file=target/imagens/corrompido.img,format=raw,if=ide,index=2,snapshot=on",
    "-nic", "user,model=rtl8139,guestfwd=tcp:10.0.2.100:7-cmd:cat",
]
test-success-exit-code = 33
test-timeout = 60

# `fatimg` escreve imagens FAT16 em memória. Roda em dois lugares: no
# `build.rs` (host, gera o ramdisk e o disco) e nos testes do kernel (target
# `no_std`, fabrica imagens válidas e adultera cópias para provar que o leitor
# recusa volumes corrompidos). Por isso é dependência de build **e** de teste.
[build-dependencies]
fatimg = { path = "fatimg" }

[dev-dependencies]
fatimg = { path = "fatimg" }

# O pacote raiz continua sendo o kernel. `programs`, `runtime`, `abi` e
# `fatimg` são membros do workspace só para satisfazer o cargo (um pacote
# dentro da árvore de outro precisa ser membro ou estar excluído), e
# `default-members` mantém
# `cargo run` e `cargo test` restritos ao kernel: `programs` (e `runtime`, que
# eles usam) só são compilados pelo `build.rs` do kernel, para o target de
# usuário. Só `abi` entra no kernel como dependência (as constantes do
# contrato de syscalls, compartilhadas com a biblioteca de runtime); `fatimg`
# entra só como dependência de build e de teste.
[workspace]
members = ["programs", "runtime", "abi", "fatimg"]
default-members = ["."]
